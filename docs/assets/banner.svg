<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="title">
  <title id="title">Wise Bucket: long-term context and insights for time-series data</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#132440"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#334155"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect x="880" width="400" height="320" rx="24" fill="url(#grid)" opacity="0.6"/>

  <!-- Logo -->
  <text x="200" y="168" font-size="180" text-anchor="middle" dominant-baseline="central">🪣</text>

  <!-- Wordmark -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="360" y="160" font-size="88" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">Wise <tspan fill="#2dd4bf">Bucket</tspan></text>
    <text x="364" y="212" font-size="28" fill="#94a3b8">Long-term context &amp; insights for your time-series data</text>
  </g>
  <text x="364" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#5eead4" opacity="0.85">MCP server · CSV · Parquet · MDF4 · TDMS · HDF5 · CAN · MCAP · ULog</text>
</svg>
