[package]
name = "wb-data"
description = "Wise Bucket data: recording readers, the columnar store (Lance) and SQL (DataFusion)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
wb-core = { path = "../wb-core" }
# One Arrow version (58) is shared by DataFusion 54, Lance 13 and re_ros_msg 0.38:
# upgrade the three together (ADR 0013).
datafusion = { version = "54.1", default-features = false, features = ["nested_expressions", "datetime_expressions", "regex_expressions", "string_expressions", "unicode_expressions", "parquet", "recursive_protection", "sql"] }
lance = { version = "13", default-features = false }
lance-file = { version = "13", default-features = false }
lance-index = { version = "13", default-features = false }
re_ros_msg = "0.38"
mcap = "0.25"
px4-ulog = "0.6"
rusqlite = { version = "0.40", features = ["bundled"] }
futures = "0.3"
hex = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1.44"
mavlink = { version = "0.19.1", default-features = false, features = ["std", "serde", "dialect-ardupilotmega"] }

[dev-dependencies]
tempfile = "3"
