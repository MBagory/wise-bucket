[package]
name = "wb-data"
description = "Wise Bucket data: recording readers, the columnar store (Parquet) and SQL (DataFusion)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
wb-core = { path = "../wb-core" }
# One Arrow version (58) is shared by DataFusion 54, parquet 58, re_ros_msg 0.38 and
# rerun 0.38: upgrade them together (ADR 0021).
datafusion = { version = "54.1", default-features = false, features = ["nested_expressions", "datetime_expressions", "regex_expressions", "string_expressions", "unicode_expressions", "parquet", "recursive_protection", "sql"] }
parquet = { version = "58", default-features = false, features = ["arrow", "zstd"] }
re_ros_msg = "0.38"
rerun = { version = "0.38", default-features = false, features = ["sdk"] }
mcap = "0.25"
nmea = { version = "0.8", features = ["serde"] }
chrono = { version = "0.4", default-features = false }
prost-reflect = { version = "0.16", features = ["serde"] }
px4-ulog = "0.6"
rusqlite = { version = "0.40", features = ["bundled"] }
futures = "0.3"
hex = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1.44"
blf_asc = "0.2"
# Only its decoder: no serial port, SocketCAN or USB.
canboat = { version = "8", default-features = false, features = ["decode"] }
# Without its memory map: a log may still be being written.
dflog = { version = "0.2", default-features = false }
# MDF4 files and DBC decoding (can-dbc parses); not its arrow/parquet features (Arrow 59,
# ADR 0021), nor its memory map (a logger may still be writing the file).
falcon_mdf = { version = "0.7", default-features = false, features = ["dbc"] }
mavlink = { version = "0.19.1", default-features = false, features = ["std", "serde", "dialect-ardupilotmega"] }

[dev-dependencies]
prost = "0.14"
prost-types = "0.14"
tempfile = "3"
