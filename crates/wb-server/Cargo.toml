[package]
name = "wb-server"
description = "Wise Bucket: MCP server and CLI for evidence-backed, iterative robot investigations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "../../README.md"

[lints]
workspace = true

[[bin]]
name = "wisebucket"
path = "src/bin/wisebucket.rs"

[[bin]]
name = "wbk"
path = "src/bin/wbk.rs"

[dependencies]
wb-core = { path = "../wb-core" }
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap-markdown = "0.1.5"
dialoguer = { version = "0.12", default-features = false }
rmcp = { version = "3.4.1", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
dunce = "1.0.5"
toml = "1.1.6"
anstream = "1"
clap_complete = "4"

[dev-dependencies]
rmcp = { version = "3.4.1", features = ["client", "transport-child-process"] }
tempfile = "3"
