[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax).
# Linux binaries are static musl: they run on any distro. Building needs a C
# compiler.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Archives are .tar.gz: every Linux has gzip, minimal images lack xz (ADR 0028)
unix-archive = ".tar.gz"

# Archives hold `wisebucket` only; the installer links `wbk` to it (ADR 0028)
[dist.binaries]
"*" = ["wisebucket"]

[dist.bin-aliases]
wisebucket = ["wbk"]

# Build aarch64 Linux natively instead of cross-compiling
[dist.github-custom-runners]
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
