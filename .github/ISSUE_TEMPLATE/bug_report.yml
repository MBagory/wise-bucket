name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `wise-bucket-server doctor --json`
      description: It contains no secrets. Paste it here.
      render: json
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `wise-bucket-server --version`
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux x86_64, Linux arm64, macOS Apple Silicon, macOS Intel, Windows (WSL2), Other]
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Harness and version
      placeholder: Claude Code 2.x, Cline 3.x, …
