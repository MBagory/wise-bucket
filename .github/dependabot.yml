version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # datafusion, parquet, re_ros_msg and rerun share one Arrow version: they move together (ADR 0021).
      # This PR stays red until all three support the same Arrow; then it's the upgrade.
      arrow-stack:
        patterns: ["datafusion*", "parquet", "re_ros_msg", "rerun"]
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
