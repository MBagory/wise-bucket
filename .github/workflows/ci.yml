name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache managed PostgreSQL runtime
        uses: actions/cache@v6
        with:
          path: target/tmp/wb-runtime
          key: wb-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/wb-core/src/db/managed.rs') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  byo-postgres:
    name: bring-your-own PostgreSQL (pgvector container)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: wbtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p wb-server --test m0 bring_your_own_postgres -- --nocapture
        env:
          WB_TEST_DATABASE_URL: postgres://postgres:pw@localhost:5432/wbtest

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generated reference pages are up to date
        run: cargo run -q -p wb-server -- docs gen --check
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mdbook build docs
      - name: Spell check
        uses: crate-ci/typos@v1
      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress README.md 'docs/src/**/*.md' CONTRIBUTING.md SECURITY.md
          fail: true

  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
