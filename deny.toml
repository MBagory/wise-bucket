# cargo-deny: licenses, advisories, bans and sources. https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # paste: archived compile-time macro crate used by mcap, parquet and rerun; unmaintained, not a vulnerability, no fix upstream.
  { id = "RUSTSEC-2024-0436", reason = "paste is archived; pulled in by mcap, parquet and rerun, no alternative upstream" },
  # quick-xml 0.37, pinned by falcon_mdf 0.7 (DBC decoding, MDF4); fixed in 0.41. Revisit when falcon_mdf moves to quick-xml >= 0.41.
  { id = "RUSTSEC-2026-0194", reason = "quadratic attribute check: reached only by MDF4 XML metadata, in the low-priority extraction process stopped after an hour; never by DBC decoding" },
  { id = "RUSTSEC-2026-0195", reason = "NsReader namespace allocation: falcon_mdf uses the plain Reader, never NsReader" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Licenses compatible with distributing Wise Bucket under Apache-2.0.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "BSL-1.0",
  "0BSD",
  "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
