[workspace]
resolver = "3"
members = ["crates/wb-core", "crates/wb-data", "crates/wb-server"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/MBagory/wise-bucket"
homepage = "https://github.com/MBagory/wise-bucket"
authors = ["Matthieu Bagory"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
