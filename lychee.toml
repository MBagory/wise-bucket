# Link checker configuration (https://lychee.cli.rs)
max_retries = 3
timeout = 20
accept = ["200..=299", "403", "429"]
exclude = [
  # Not reachable until the repository and documentation site are public.
  "^https://github.com/MBagory/wise-bucket",
  "^https://mbagory.github.io/wise-bucket",
  "^http://localhost",
]
exclude_path = ["docs/book"]
